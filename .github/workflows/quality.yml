# 质量门禁 v1（2026-11-08）
#
# 六道：Rust 格式检查 / Rust Clippy / Rust 测试 / 前端 svelte-check / 前端 lint（prettier + eslint）/ 文档站构建。
#
# 几个刻意不做的事：
# - 不用 `npm run check:node20` / `build:node20`：那是 Windows 本地给 npx 用的包装脚本，
#   CI 里 setup-node 已经钉了 Node 版本，直接 `npm run check` / `npm run lint` 才和 build.yml 的构建方式一致。
# - fmt 关不装 cargo 缓存：只跑 rustfmt、不编译，装缓存比它省下的时间还贵。
name: 质量门禁

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rust 格式检查
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 读取 rust-toolchain.toml 里的工具链版本
        id: toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml | head -n 1)"
          if [ -z "$channel" ]; then
            echo "读不到 rust-toolchain.toml 里的 channel" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: 安装 Rust 工具链（只装 rustfmt）
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  frontend:
    name: 前端检查
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 安装 Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        working-directory: web
        run: npm ci
      - name: svelte-check
        working-directory: web
        run: npm run check

  lint:
    name: 前端 lint
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 安装 Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        working-directory: web
        run: npm ci
      - name: prettier --check + eslint
        working-directory: web
        run: npm run lint

  docs:
    name: 文档站构建
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 安装 Node 18
        uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: 安装依赖并构建
        working-directory: docs
        run: |
          npm ci
          npm run docs:build

  clippy:
    name: Rust Clippy
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 读取 rust-toolchain.toml 里的工具链版本
        id: toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml | head -n 1)"
          if [ -z "$channel" ]; then
            echo "读不到 rust-toolchain.toml 里的 channel" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: 安装 Rust 工具链（clippy + rustfmt）
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt
      - name: 缓存 cargo 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: '占位前端产物目录（rust-embed 的 #[folder = "../../web/build"] 缺目录会编译失败）'
        # index.html 一起补上：build.rs 检查前端产物时会打印 cargo:warning，避免日志出现噪音。
        run: mkdir -p web/build && touch web/build/index.html
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Rust 测试
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 读取 rust-toolchain.toml 里的工具链版本
        id: toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml | head -n 1)"
          if [ -z "$channel" ]; then
            echo "读不到 rust-toolchain.toml 里的 channel" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: '占位前端产物目录（rust-embed 的 #[folder = "../../web/build"] 缺目录会编译失败）'
        run: mkdir -p web/build && touch web/build/index.html
      - name: cargo test
        run: cargo test --bin bili-sync-rs
