# 可选：TikTok「我的喜欢/关注列表」浏览器会话模拟用的远程 Chromium（Docker/群晖无本机 Chrome 时使用）。
# 启动后在 设置 → TikTok 登录状态 → 远程 Chromium 浏览器模拟 填入 http://<本机IP>:9222 并保存。
# chromium:
#   image: lscr.io/linuxserver/chromium:latest
#   container_name: chromium
#   environment:
#     - PUID=1000
#     - PGID=1000
#     - TZ=Asia/Shanghai
#     - CHROME_CLI=--remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 --remote-allow-origins=*
#   ports:
#     - "9222:9222"
#   volumes:
#     - ./config/chromium:/config
#   shm_size: "1gb"
#   restart: unless-stopped

services:
  bili-sync:
    # image: bili-sync:latest
    # 如果想本地构建，取消注释下面三行
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: bridge
    # 该选项请仅在日志终端支持彩色输出时启用，否则日志中可能会出现乱码
    tty: false
    # 非必需设置项，推荐设置为宿主机用户的 uid 及 gid (`$uid:$gid`)
    # 可以执行 `id ${user}` 获取 `user` 用户的 uid 及 gid
    # 程序下载的所有文件权限将与此处的用户保持一致，不设置默认为 Root
    # user: 1000:1000
    hostname: bili-sync
    container_name: bili-sync
    # 程序默认绑定 0.0.0.0:12345 运行 http 服务
    ports:
      - 12345:12345
    volumes:
      - ./config:/app/.config/bili-sync
      - ./Downloads:/Downloads
    logging:
      driver: "local"
    environment:
      - TZ=Asia/Shanghai
      - RUST_LOG=None,bili_sync=info
      # 可选：设置执行周期，默认为每天凌晨3点执行
      # - BILI_SYNC_SCHEDULE=0 3 * * *
    # 资源限制（可选）
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2'
    #       memory: 2G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 500M
